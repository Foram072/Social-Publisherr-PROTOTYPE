<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing you in | Social Wise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f8fafc;
            color: #1e293b;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
            padding: 40px;
            max-width: 440px;
            width: 90%;
            text-align: center;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #0076e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #0f172a;
        }

        p {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .error-box {
            display: none;
            background: #fef2f2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            border: 1px solid #fecaca;
            margin-bottom: 16px;
        }

        .btn-retry {
            display: none;
            padding: 10px 20px;
            background: #0076e5;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
        }

            .btn-retry:hover {
                background: #0060ba;
            }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" id="spinner"></div>
        <h2 id="heading">Signing you in…</h2>
        <p id="subheading">Verifying your account and preparing your workspace.</p>
        <div class="error-box" id="errorBox"></div>
        <a href="/login" class="btn-retry" id="retryBtn">Return to Login</a>
    </div>

    <script>
        (async function () {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const token = params.get('token');
            const error = params.get('error');

            const heading = document.getElementById('heading');
            const subheading = document.getElementById('subheading');
            const spinner = document.getElementById('spinner');
            const errorBox = document.getElementById('errorBox');
            const retryBtn = document.getElementById('retryBtn');

            function showError(msg) {
                spinner.style.display = 'none';
                heading.textContent = 'Authentication Failed';
                subheading.textContent = 'We could not complete your sign-in.';
                errorBox.textContent = msg;
                errorBox.style.display = 'block';
                retryBtn.style.display = 'inline-block';
            }

            if (error) {
                showError('Sign-in was cancelled or returned an error: ' + error);
                return;
            }

            if (!token) {
                showError('No security token was received from the authentication provider.');
                return;
            }

            // Save token
            sessionStorage.setItem('wiseliy_token', token);

            // Fetch user info from /api/social/auth/me using Bearer token
            const API_ORIGIN = window.location.protocol === "file:" ? "http://localhost:5293" : "";
            try {
                const res = await fetch(`${API_ORIGIN}/api/social/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!res.ok) {
                    throw new Error('Failed to retrieve user profile.');
                }

                const data = await res.json();
                if (data.user) {
                    sessionStorage.setItem('wiseliy_user', JSON.stringify(data.user));
                }
                if (data.brands && data.brands.length > 0) {
                    sessionStorage.setItem('wiseliy_client_id', String(data.brands[0].id));
                }

                heading.textContent = 'Welcome back!';
                subheading.textContent = 'Redirecting to your dashboard…';
                setTimeout(() => {
                    window.location.replace('/');
                }, 800);
            } catch (err) {
                showError(err.message || 'Could not load your user profile.');
            }
        })();
    </script>
</body>
</html>
